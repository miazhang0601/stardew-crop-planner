server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular handles its own routes, so unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
  }
}
